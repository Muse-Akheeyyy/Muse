<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Muse — music without the noise">
  <title>Muse — music without the noise</title>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120e17"/>
      <stop offset="0.5" stop-color="#1b1424"/>
      <stop offset="1" stop-color="#0f0b14"/>
    </linearGradient>

    <linearGradient id="word" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#b79ce6"/>
      <stop offset="0.45" stop-color="#f7f2ff">
        <animate attributeName="stop-color" values="#f7f2ff;#ffffff;#f7f2ff" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#a98bec"/>
    </linearGradient>

    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#5b3d90"/>
      <stop offset="1" stop-color="#d9c8ff"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8e6fc1" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#8e6fc1" stop-opacity="0.35"/>
      <stop offset="0.82" stop-color="#8e6fc1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8e6fc1" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <filter id="aurora" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="120"/>
    </filter>

    <clipPath id="card">
      <rect width="1200" height="400" rx="32"/>
    </clipPath>
  </defs>

