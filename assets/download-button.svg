<svg xmlns="http://www.w3.org/2000/svg" width="260" height="64" viewBox="0 0 260 64" role="img" aria-label="Download the latest APK">
  <title>Download the latest APK</title>
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5bb5"/>
      <stop offset="1" stop-color="#a385e0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9b2f0" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#c9b2f0" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="bloom" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect x="6" y="10" width="248" height="44" rx="22" fill="url(#fill)" filter="url(#bloom)" opacity="0.45">
    <animate attributeName="opacity" values="0.32;0.55;0.32" dur="5.2s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(130 32)">
    <rect x="-126" y="-26" width="252" height="52" rx="26" fill="none" stroke="#c9b2f0" stroke-width="1.4">
      <animateTransform attributeName="transform" type="scale" values="1;1;1.075" keyTimes="0;0.35;1" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.5;0.5;0" keyTimes="0;0.35;1" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="4" y="6" width="252" height="52" rx="26" fill="url(#fill)"/>
  <rect x="5.5" y="7.5" width="249" height="49" rx="24.5" fill="none" stroke="url(#edge)" stroke-opacity="0.7"/>

  <g transform="translate(54 23)" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 1 V12"/>
    <path d="M3.5 8 L8 12.5 L12.5 8"/>
    <path d="M2 16.5 H14"/>
    <animateTransform attributeName="transform" type="translate" values="54 23; 54 26; 54 23" keyTimes="0;0.5;1" dur="2.6s" repeatCount="indefinite"/>
  </g>

  <g fill="#ffffff" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="600">
    <text x="80" y="38" textLength="88" lengthAdjust="spacingAndGlyphs">Download</text>
    <text x="173" y="38" textLength="32" lengthAdjust="spacingAndGlyphs" font-weight="500" fill="#f0e6ff">APK</text>
  </g>
</svg>
