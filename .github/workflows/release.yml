name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^appVersion=//p' gradle.properties | head -n1)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid appVersion: '$version'" >&2
            exit 1
          }
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="${GITHUB_REF_NAME#v}"
            test "$tag" = "$version" || {
              echo "Tag $GITHUB_REF_NAME does not match appVersion $version" >&2
              exit 1
            }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Prepare CI Gradle
        uses: ./.github/actions/prepare-ci-gradle
        with:
          cache-scope: android-release
          persist-configuration-cache: 'false'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - name: Install SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37.1" "build-tools;37.0.0" "ndk;30.0.16248370" "cmake;4.1.2"

      - name: Prepare Android signing
        id: signing
        uses: ./.github/actions/prepare-android-signing
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Require signing
        if: steps.signing.outputs.signing_available != 'true'
        shell: bash
        run: |
          echo "Android release signing secrets are required" >&2
          exit 1

      - name: Build release APK
        shell: bash
        env:
          KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :androidApp:assembleRelease \
            --no-configuration-cache --no-daemon \
            --max-workers="$(nproc)" \
            "-Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8" \
            -x :androidApp:lintVitalRelease

      - name: Collect Muse.apk
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/collect_android_apks.py \
            androidApp/build/outputs/apk/release dist "$APP_VERSION" release

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort | tail -n1)"
          test -x "$apksigner" || { echo "apksigner was not found" >&2; exit 1; }
          "$apksigner" verify --verbose --print-certs dist/Muse.apk

      - name: Upload APK artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Muse.apk
          path: dist/Muse.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          bash .github/scripts/parse_changelog.sh "$VERSION" docs/changelog.md > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" dist/Muse.apk \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag
